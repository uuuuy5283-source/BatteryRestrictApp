name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "SDK=$SDK"
          SM=$(find "$SDK/cmdline-tools" -type f -name sdkmanager | head -n 1)
          echo "sdkmanager=$SM"
          test -n "$SM"
          set +o pipefail
          yes | "$SM" --licenses >/dev/null || true
          set -o pipefail
          "$SM" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BatteryRestrict.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: BatteryRestrict-apk
          path: BatteryRestrict.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: تقييد البطارية v1.0.${{ github.run_number }}
          body: |
            حمّل ملف **BatteryRestrict.apk** وثبّته على الموبايل.

            - أندرويد 8 أو أحدث
            - محتاج تطبيق شيزوكو (Shizuku)
            - اسمح بالتثبيت من مصادر غير معروفة لو طلب النظام
          files: BatteryRestrict.apk
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
